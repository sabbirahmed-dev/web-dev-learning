<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlink Demo</title>
</head>
<body>

    <h1>HTML Hyperlink Demo</h1>

    <!-- External Hyperlink -->
    <h2>External Hyperlink</h2>
    <p> Visit <a href="https://www.google.com" target="_blank"> Google Website </a> to search anything online. </p>
    <p> Visit <a href="https://www.wikipedia.org" target="_blank"> Wikipedia </a> to learn new things. </p>

    <hr>

    <!-- Internal Hyperlink -->
    <h2>Internal Hyperlink</h2>

    <p> <a href="about.html">Go to About Section</a> </p>
    <p> <a href="contact.html">Go to Contact Section</a> </p>

</body>
</html>
